# Builds a universal (Apple silicon + Intel) Under the Rug.app and publishes it as a GitHub release
# whenever a version tag is pushed:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The app is ad-hoc signed, not notarized: the first launch needs System Settings → Privacy & Security → Open Anyway.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Work out the version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build the app
        env:
          UNIVERSAL: "1"
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build-app.sh

      - name: Check the binary
        run: lipo -info "build/Under the Rug.app/Contents/MacOS/UnderTheRug"

      - name: Zip it
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/Under the Rug.app" "UnderTheRug-${{ steps.version.outputs.version }}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ZIP="UnderTheRug-${{ steps.version.outputs.version }}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "Under the Rug $TAG" --generate-notes
          fi
